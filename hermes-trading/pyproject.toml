[project]
name = "hermes-trading"
version = "0.1.0"
description = "Local human-approved paper-trading agent with Hermes (Claude API) as the reflection brain"
requires-python = ">=3.10"
dependencies = [
    "ccxt>=4.0",
    "yfinance>=0.2.40",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Optional Discord approvals bot:  pip install -e ".[discord]"
discord = ["discord.py>=2.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hermes_trading", "hermes_trading.adapters", "dashboard"]
