# Active strategy: Sector Relative-Strength Rotation (SRSR). See docs/strategy-srsr.md.
# Hermes may tune the numeric dials (trend_sma_days, exit_rank_n, catastrophe_stop_pct,
# position_notional_cap_pct, stock_notional_cap_pct); the rest — incl. hold_top_n /
# max_positions, universe, stocks, max_stock_positions — is locked.
# v02: trend_sma_days 200->250, exit_rank_n 4->6 (optimizer-found, OOS-validated:
# Sharpe 0.43->0.66, CAGR +5.6%->+9.4%, maxDD -23.7%->-20.9% on the 2021-2026 holdout).
# v03: sizing equal_weight->rank_weight (conviction-by-rank, power 1). OOS-validated across
# 4 splits: vs equal-weight +0.10-0.13 Sharpe, +0.3-0.6pp CAGR, maxDD -16.4% vs -20.9%
# (train Sharpe flat = not overfit). Return gain survives no-cap (real momentum-conviction
# alpha); the drawdown gain is the 35% cap diverting #1's overflow to cash (~18% vs 8%).
# v04: added JEPI, JEPQ and opened a 4th slot (hold_top_n 3->4) so an income/covered-call
# ETF can be held as a 4th position WHEN it earns it. Still dual-momentum gated like every
# other name: only bought if it beats SPY momentum AND sits above its 250-day trend, so in a
# strong up-tape these two will usually sit out (by design).
# v05: mixed 7 liquid mega-cap single stocks into the universe (discretionary structural
# change, like v04 — backtest before trusting). They rank through the SAME dual-momentum
# gate but carry their own risk rules: tighter 20% cap, wider 25% stop (single names are
# noisier; risk is capped by the smaller size), and at most 2 of the 4 slots — the book
# can never become an all-single-name portfolio.
version: "05"
type: relative_strength_rotation
universe: [XLK, XLF, XLV, XLE, XLI, XLY, XLP, XLU, XLB, XLRE, XLC, JEPI, JEPQ,
           NVDA, MSFT, AAPL, GOOGL, AMZN, META, AVGO]
stocks: [NVDA, MSFT, AAPL, GOOGL, AMZN, META, AVGO]   # single names within the universe
benchmark: SPY
momentum_lookbacks_days: [63, 126]   # 3-month + 6-month blend
trend_sma_days: 250                   # absolute-trend filter (OOS-validated)
hold_top_n: 4                         # number of slots (opened a 4th for JEPI/JEPQ)
exit_rank_n: 6                        # sell when it drops out of the top N (hysteresis, OOS-validated)
rebalance: weekly
sizing: rank_weight                   # conviction-by-rank: weight ∝ (N-rank)**rank_power; #1 biggest
rank_power: 1                         # 1 = linear decay (validated). DON'T raise to 2 (that's just cash)
position_notional_cap_pct: 35         # caps the #1 slot; overflow goes to cash (the DD cushion)
catastrophe_stop_pct: 15              # fast backstop only; trend + rank are the real exits
stock_notional_cap_pct: 20            # tighter cap per single stock (single-name risk control)
stock_catastrophe_stop_pct: 25        # wider stop for single names (noisier; risk capped by size)
max_stock_positions: 2                # at most 2 of the 4 slots can be single stocks
max_positions: 4
